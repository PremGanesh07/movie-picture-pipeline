name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - "starter/frontend/**"
      - ".github/workflows/frontend-continuous-deployment.yml"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18.14.2"

      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18.14.2"

      - run: npm ci
      - run: npm test -- --watchAll=false

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL=http://localhost:5000 \
            --tag ${{ steps.login-ecr.outputs.registry }}/frontend:${{ github.sha }} \
            starter/frontend

          docker push ${{ steps.login-ecr.outputs.registry }}/frontend:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name cluster

      - name: Check EKS node groups
        run: |
          echo "========================================"
          echo "EKS CLUSTER"
          echo "========================================"

          aws eks describe-cluster \
            --region us-east-1 \
            --name cluster \
            --query 'cluster.status' \
            --output text

          echo ""
          echo "========================================"
          echo "EKS NODE GROUPS"
          echo "========================================"

          aws eks list-nodegroups \
            --region us-east-1 \
            --cluster-name cluster \
            --output table

          echo ""
          echo "========================================"
          echo "NODE GROUP DETAILS"
          echo "========================================"

          NODEGROUPS=$(aws eks list-nodegroups \
            --region us-east-1 \
            --cluster-name cluster \
            --query 'nodegroups[]' \
            --output text)

          if [ -z "$NODEGROUPS" ]; then
            echo "NO EKS NODE GROUPS FOUND"
          else
            for NODEGROUP in $NODEGROUPS; do
              echo ""
              echo "----------------------------------------"
              echo "NODE GROUP: $NODEGROUP"
              echo "----------------------------------------"

              aws eks describe-nodegroup \
                --region us-east-1 \
                --cluster-name cluster \
                --nodegroup-name "$NODEGROUP" \
                --query 'nodegroup.{Status:status,Desired:scalingConfig.desiredSize,Min:scalingConfig.minSize,Max:scalingConfig.maxSize,InstanceTypes:instanceTypes,Health:health}' \
                --output yaml
            done
          fi

      - name: Install Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/kustomize

      - name: Set frontend image
        working-directory: starter/frontend/k8s
        run: |
          kustomize edit set image \
            frontend=451089618050.dkr.ecr.us-east-1.amazonaws.com/frontend=${{ github.sha }}

      - name: Deploy frontend
        working-directory: starter/frontend/k8s
        run: |
          kubectl apply -k .

      - name: Verify frontend deployment
        run: |
          echo "========================================"
          echo "FRONTEND PODS"
          echo "========================================"
          kubectl get pods -l app=frontend -o wide || true

          echo ""
          echo "========================================"
          echo "ALL PODS"
          echo "========================================"
          kubectl get pods -A -o wide || true

          echo ""
          echo "========================================"
          echo "FRONTEND DEPLOYMENT"
          echo "========================================"
          kubectl get deployment frontend -o wide || true

          echo ""
          echo "========================================"
          echo "FRONTEND SERVICE"
          echo "========================================"
          kubectl get service frontend -o wide || true

          echo ""
          echo "========================================"
          echo "FRONTEND ENDPOINTS"
          echo "========================================"
          kubectl get endpoints frontend -o wide || true

          echo ""
          echo "========================================"
          echo "FRONTEND EVENTS"
          echo "========================================"
          kubectl get events \
            --sort-by=.lastTimestamp | tail -50 || true

          echo ""
          echo "========================================"
          echo "FRONTEND POD DETAILS"
          echo "========================================"

          POD=$(kubectl get pods \
            -l app=frontend \
            -o jsonpath='{.items[0].metadata.name}' \
            2>/dev/null || true)

          if [ -n "$POD" ]; then
            kubectl describe pod "$POD" || true
          else
            echo "No frontend pod found"
          fi

          echo ""
          echo "========================================"
          echo "FRONTEND LOGS"
          echo "========================================"

          if [ -n "$POD" ]; then
            kubectl logs "$POD" --tail=100 || true
          else
            echo "No frontend logs available"
          fi

      - name: Get frontend service URL
        run: |
          echo "========================================"
          echo "FRONTEND SERVICE URL"
          echo "========================================"

          kubectl get service frontend -o wide

          echo ""
          echo "External URL:"
          kubectl get service frontend \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'

          echo ""